# Run `pre-commit install` to set up the repository hooks.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: rust-linting
        name: Rust linting
        entry: cargo fmt --all --
        pass_filenames: true
        types: [file, rust]
        language: system
      - id: rust-clippy
        name: Rust clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        pass_filenames: false
        types: [file, rust]
        language: system
